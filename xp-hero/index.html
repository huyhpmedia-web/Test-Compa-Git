<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XP Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* One fantasy-RPG look on purpose: the game is its own world, not themed by the host. 9:16 stage, letterboxed. */
  :root{
    --ink:#1b1420; --bone:#fff6e0; --xp:#5cf0c0; --gold:#ffc531; --eat:#7dff6a; --near:#ffd23a; --danger:#ff5a46; --ember:#ff7a1a; --ice:#7fe4ff;
    --panel:rgba(16,12,24,.72); --font:"Lilita One",ui-rounded,"Segoe UI",system-ui,sans-serif; color-scheme:dark;
  }
  html,body{margin:0;height:100%;overflow:hidden;color:var(--bone);font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at center,#2a2236,#0c0a12)}
  #stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6);background:#101018}
  #stage canvas{display:block;position:absolute;inset:0}
  #ui{position:absolute;inset:0;pointer-events:none}
  .ov{position:absolute;inset:0;opacity:0}
  #hurt{background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(200,10,0,.7) 100%)}
  #frostOv{background:radial-gradient(ellipse at center,rgba(120,220,255,0) 40%,rgba(160,235,255,.75) 100%)}
  #fireOv{background:radial-gradient(ellipse at center,rgba(255,120,0,0) 45%,rgba(255,80,0,.55) 100%)}
  #flash{background:#fffbe8}
  #top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:8px}
  .lv{position:relative;width:52px;height:52px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7af0ff,#2a6ad0 70%);
    display:grid;place-items:center;font-size:26px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35)}
  .lv.bump{animation:bump .35s}
  @keyframes bump{50%{transform:scale(1.25)}}
  .xpwrap{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .pow{font-size:24px;line-height:1;display:flex;align-items:center;gap:4px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .pow b{font-weight:400;font-variant-numeric:tabular-nums}
  .xpbar{height:14px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
  .xpbar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ad8a0,#9effd8);box-shadow:0 0 10px #5cf0c0;transition:width .15s}
  #tools{pointer-events:auto;flex:none;align-self:flex-start;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #tools button{font:14px/1 var(--font);color:var(--ink);background:var(--bone);border:2px solid #4a3a5a;border-radius:10px;padding:7px 9px 5px;cursor:pointer;box-shadow:0 2px 0 #4a3a5a;min-width:112px;text-align:left}
  #tools #bGear{min-width:0;width:38px;height:38px;padding:0;text-align:center;font-size:19px;border-radius:50%}
  #tools .panel{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #tools .panel[hidden]{display:none}
  .gold{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:2px 12px 0 4px;font-size:20px;font-variant-numeric:tabular-nums}
  .gold .c{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a0,#ffc531 55%,#b87a06);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
  .gold.bump{animation:bump .25s}
  .path{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:3px 10px}
  .path span{font-size:18px;line-height:1;opacity:.35;filter:grayscale(1);transition:all .3s}
  .path span.on{opacity:1;filter:none;transform:scale(1.2)} .path span.done{opacity:.85;filter:none}
  .path i{display:block;width:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
  #boss{display:none;align-items:center;gap:6px;background:rgba(50,10,6,.85);border-radius:999px;padding:3px 10px;font-size:18px;align-self:center}
  #boss i{display:block;width:170px;height:12px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
  #boss u{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b1a,#ffb21a);transition:width .15s}
  .btn{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:0;padding:0;pointer-events:auto;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.4)}
  .btn .ic{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-size:36px;line-height:1}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #bSkill{right:18px;background:conic-gradient(var(--ember) calc(var(--c,0)*1turn),rgba(255,255,255,.14) 0)}
  #bSkill .ic{background:#2a1a24;filter:grayscale(.85)}
  #bSkill.ready .ic{filter:none;background:radial-gradient(circle,#ff9a3d,#b8300c);animation:pulse .8s ease-in-out infinite}
  #bSkill.locked{opacity:.35}
  #bSword{left:18px;background:rgba(255,255,255,.14)}
  #bSword .ic{background:#2a2430;filter:grayscale(.85);font-size:34px}
  #bSword .cost{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);background:#1a1420;border-radius:999px;padding:2px 8px 0;font-size:15px;white-space:nowrap;
    display:flex;align-items:center;gap:3px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
  #bSword .cost i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold)}
  #bSword.ready{background:conic-gradient(var(--gold) 1turn,transparent 0)}
  #bSword.ready .ic{filter:none;background:radial-gradient(circle,#ffe58a,#c98a06);animation:pulse .8s ease-in-out infinite}
  #bSword.max{display:none}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #swordHand{position:absolute;left:58px;bottom:calc(76px + env(safe-area-inset-bottom,0px));font-size:46px;opacity:0;transition:opacity .3s;animation:poke 1s ease-in-out infinite}
  @keyframes poke{50%{transform:translate(-6px,8px)}}
  #joy{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.5);display:none}
  #joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.85)}
  #tut{position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);transition:opacity .4s}
  #tut .hand{font-size:54px;display:inline-block;animation:swipe 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
  @keyframes swipe{0%,100%{transform:translateX(-40px) rotate(-8deg)}50%{transform:translateX(40px) rotate(8deg)}}
  #banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;transition:all .25s;text-shadow:0 4px 0 rgba(0,0,0,.45);white-space:nowrap}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner .big{font-size:52px;line-height:1;color:#ffe14d}
  #banner .sm{font-size:22px;line-height:1.1;color:var(--bone)}
  .lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
  .pw{font-size:15px;line-height:1;padding:3px 7px 1px;border-radius:8px;background:rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
  .pw.eat{color:var(--eat)} .pw.near{color:var(--near)} .pw.danger{color:var(--danger);background:rgba(70,0,0,.6)}
  .pw.me{font-size:19px;color:#fff;background:rgba(0,0,0,.6)}
  .pw.boss{font-size:22px;padding:4px 10px 2px}
  .pw.frozen{color:var(--ice)}
  .dmg{font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.4)}
  .dmg.big{font-size:28px;color:#ffe14d} .dmg.ice{color:var(--ice)} .dmg.fire{color:#ffb14d}
  .float{font-size:24px;color:var(--xp);text-shadow:0 2px 0 rgba(0,0,0,.5)}
  #end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:rgba(10,6,16,.6);pointer-events:auto}
  #end .logo{text-align:center;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:float 2s ease-in-out infinite}
  #end .logo .em{font-size:96px}
  #end .logo .t{font-size:56px;color:#ffe14d;letter-spacing:.03em;text-shadow:0 4px 0 #b8600c}
  @keyframes float{50%{transform:translateY(-8px)}}
  #bPlay{font:48px/1 var(--font);color:#fff;letter-spacing:.02em;border:0;border-radius:24px;padding:20px 44px 14px;cursor:pointer;
    background:linear-gradient(#5fe04a,#28a81e);box-shadow:0 9px 0 #16700f,0 14px 28px rgba(0,0,0,.4);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:pulse 1.1s ease-in-out infinite}
  #bPlay:active{transform:translateY(5px);box-shadow:0 4px 0 #16700f}
  @media (prefers-reduced-motion:reduce){#tut .hand,#bSkill.ready .ic,#bSword.ready .ic,#bPlay,#end .logo,#swordHand{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="ui">
    <div class="ov" id="frostOv"></div><div class="ov" id="fireOv"></div><div class="ov" id="hurt"></div>
    <div id="labels"></div>
    <div id="top">
      <div class="row">
        <div class="lv" id="lvBadge">1</div>
        <div class="xpwrap"><div class="pow">⚔️ <b id="pw">4</b></div><div class="xpbar"><u id="xpBar"></u></div></div>
        <div id="tools">
          <button id="bGear" type="button" aria-label="Review tools">⚙</button>
          <div class="panel" id="toolPanel" hidden>
            <button id="bLvl" type="button">⬆ +3 Level</button>
            <button id="bGold" type="button">🪙 +Gold</button>
            <button id="bFill" type="button">💥 Skill full</button>
            <button id="bNext" type="button">⏭ Next level</button>
            <button id="bEnd" type="button">🏁 End card</button>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="gold" id="goldPill"><span class="c"></span><span id="gold">0</span></div>
        <div class="path" id="path"><span>🌳</span><i></i><span>🍄</span><i></i><span>🌋</span></div>
      </div>
      <div id="boss"><span>🗿</span><i><u id="bossBar"></u></i></div>
    </div>
    <button class="btn" id="bSword" type="button" aria-label="Upgrade sword"><span class="ic" id="swIc">🗡️</span><span class="cost"><i></i><span id="swCost">30</span></span></button>
    <div id="swordHand">👇</div>
    <button class="btn locked" id="bSkill" type="button" aria-label="Use skill"><span class="ic" id="skIc">🌀</span></button>
    <div id="tut"><div class="hand">👆</div></div>
    <div id="banner"><div class="big" id="bnBig"></div><div class="sm" id="bnSm"></div></div>
    <div id="joy"><i></i></div>
    <div class="ov" id="flash"></div>
    <div id="end"><div class="logo"><div class="em">😎</div><div class="t">XP HERO</div></div><button id="bPlay" type="button">PLAY NOW</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
/* =====================================================================
   XP HERO — template "eat-and-grow", action-RPG variant, 9:16 stage
   Map: start SOUTH, monsters get stronger going NORTH, portal at the north end,
   last level = golem boss arena. You can only hurt monsters whose power <= yours.
   Two progressions: XP -> level -> power, size, hero form, skills · Gold -> sword tier (power multiplier + effect).
   Rigs: HUMANOID (hero + biped monsters, standard bone names) · blob creatures (slime, toad).
   ===================================================================== */
const CONFIG = {
  template: 'eat-and-grow', variant: 'action-rpg', aspect: 9 / 16,
  easy: true,                              // ad playable: monsters only bump you, nothing can make you lose
  ctaUrl: 'https://example.com/store',     // PLAY NOW target (mraid.open when the ad SDK provides it)
  hero: { baseSpeed: 4.3, speedPerScale: 1.45, swing: 0.3, reach: 1.15, arc: 2.4 },
  power: { base: 4, growth: 1.28 },        // base power at level L = base * growth^(L-1)
  xpNeed: 1.6,                             // xp to next level = base power * xpNeed
  rewards: { xp: 0.9, gold: 0.22 },        // per point of monster power
  combat: { hpPerPower: 1.4, dmgPerPower: 0.55, weakBoss: 0.35 },
  swords: [
    { id: 'iron',  icon: '🗡️', name: 'IRON SWORD',  mult: 1.0,  cost: 0,    level: 0, len: 0.55, blade: 0xc8d0d8, trail: 0xffffff },
    { id: 'iron2', icon: '⚔️', name: 'IRON SWORD+', mult: 1.35, cost: 30,   level: 0, len: 0.66, blade: 0xe8eef6, trail: 0xfff1b0, guard: 0xffc531 },
    { id: 'ice',   icon: '❄️', name: 'ICE SWORD',   mult: 1.8,  cost: 240,  level: 1, len: 0.76, blade: 0x9aeaff, trail: 0x6ad8ff, freeze: true },
    { id: 'fire',  icon: '🔥', name: 'FIRE SWORD',  mult: 2.5,  cost: 1000, level: 2, len: 0.86, blade: 0xff5a10, trail: 0xff8a2a, burn: true },
  ],
  // hero forms: every evolution changes colours AND gear (headband -> helmet + cape -> horned armour -> crown + wings)
  forms: [
    { at: 1,  name: 'ROOKIE' },
    { at: 4,  name: 'SCOUT' },
    { at: 8,  name: 'KNIGHT' },
    { at: 13, name: 'PALADIN' },
    { at: 19, name: 'CHAMPION' },
  ],
  skills: { spin: { icon: '🌀', at: 3 }, frost: { icon: '❄️', sword: 'ice' }, erupt: { icon: '☄️', sword: 'fire' }, perKill: 0.16 },
  population: 22,
  spawnMix: [0.8, 0.93],
  levels: [
    { id: 'forest', icon: '🌳', w: 64, h: 96, start: [0, 42], portal: [0, -44], targetLevel: 9, range: [1, 140],
      species: ['slime', 'goblin', 'shroom'],
      sky: [0x4a7a9a, 0xbfe0c8], fog: 0x8fb8a0, sun: 0xfff0d2, ground: [0x2f5a24, 0x467a2c, 0x5a4a2a] },
    { id: 'swamp', icon: '🍄', w: 80, h: 110, start: [0, 50], portal: [0, -51], targetLevel: 15, range: [20, 900],
      species: ['slime', 'bloater', 'toad', 'brute'],
      sky: [0x3a2a4a, 0x8a9a7a], fog: 0x5a6a50, sun: 0xe8f0c0, ground: [0x2e3a22, 0x40482a, 0x3a3020] },
    { id: 'volcano', icon: '🌋', w: 90, h: 120, start: [0, 54], arena: [0, -42], arenaR: 18, range: [150, 3200],
      boss: { power: 1200, hp: 1200 * 14 },   // tuned so a fire-sword hero at ~LV20 meets it at equal power
      species: ['knight', 'magma', 'golem'],
      sky: [0x5a2a22, 0xd08a5a], fog: 0x6a3a2c, sun: 0xffc49a, ground: [0x2a2422, 0x3a302c, 0x5a3022] },
  ],
};
// monsters: build = builder, range = power range, h = label height per unit scale, rad = hitbox, kind = death effect
const SPECIES = {
  slime:   { build: 'slime', range: [1, 260], speed: 1.6, base: 0.95, rad: 1.0, h: 1.05, fx: 'goo' },
  goblin:  { build: 'biped', look: 'goblin', range: [3, 120], speed: 2.4, base: 1.0, rad: 0.8, h: 1.6, fx: 'flesh' },
  shroom:  { build: 'biped', look: 'shroom', range: [6, 160], speed: 1.8, base: 1.0, rad: 0.9, h: 1.6, fx: 'spore' },
  bloater: { build: 'biped', look: 'bloater', range: [30, 700], speed: 1.5, base: 1.05, rad: 1.05, h: 1.9, fx: 'goo' },
  toad:    { build: 'toad', range: [40, 800], speed: 1.8, base: 1.05, rad: 1.1, h: 1.4, fx: 'goo' },
  brute:   { build: 'biped', look: 'brute', range: [80, 1100], speed: 1.9, base: 1.12, rad: 1.0, h: 2.0, fx: 'flesh' },
  knight:  { build: 'biped', look: 'knight', range: [150, 2200], speed: 2.0, base: 1.05, rad: 0.9, h: 2.0, fx: 'metal' },
  magma:   { build: 'biped', look: 'magma', range: [250, 3000], speed: 1.6, base: 1.12, rad: 1.0, h: 2.1, fx: 'rock' },
  golem:   { build: 'biped', look: 'golem', range: [500, 3600], speed: 1.4, base: 1.2, rad: 1.05, h: 2.2, fx: 'rock' },
};
const LOOKS = {
  goblin:  { skin: 0x6aa83a, skin2: 0x3a6a1e, cloth: 0x6a4a2a, head: 1.25, ears: true, nose: true, weapon: 'club', bulk: 0.85, legs: 0.85, eye: 0xffe14d },

  bloater: { skin: 0x8a9a5a, skin2: 0x5a4a6a, cloth: 0x3a3028, belly: true, pustules: 0xc8e04a, eyes: 3, bulk: 1.2, legs: 0.85, head: 0.9, eye: 0xff4a2a, hunch: 0.25 },
  brute:   { skin: 0x7a5a6a, skin2: 0x3a2434, cloth: 0x2a2018, armR: 1.9, armL: 0.9, bones: 0xe8e0c8, bulk: 1.3, legs: 0.95, head: 0.75, eye: 0xff2a1a, hunch: 0.45, weapon: 'none' },
  knight:  { skin: 0x3a3236, skin2: 0x1a1416, cloth: 0x5a1a14, armor: 0x4a4650, trim: 0xff6a1a, horns: true, bulk: 1.15, legs: 1.0, head: 0.85, eye: 0xff6a1a, glowEyes: true, weapon: 'axe' },
  magma:   { rock: 0x3a2a24, rock2: 0x1a1210, cracks: 0xff5a10, bulk: 1.35, legs: 0.9, head: 0.7, eye: 0xffa01a, glowEyes: true, hunch: 0.2 },
  golem:   { rock: 0x7a7670, rock2: 0x4a4844, moss: 0x4a7a2a, runes: 0x4ad8ff, bulk: 1.45, legs: 0.85, head: 0.65, eye: 0x4ad8ff, glowEyes: true, armR: 1.25, armL: 1.25, hunch: 0.25 },
  boss:    { rock: 0x5a5650, rock2: 0x2a2826, moss: 0x3a5a22, runes: 0xff7a1a, cracks: 0xff5a10, bulk: 1.6, legs: 0.85, head: 0.7, eye: 0xff8a1a, glowEyes: true, armR: 1.4, armL: 1.4, hunch: 0.2, crystals: 0xff8a2a },
};
const FORM_LOOKS = [
  { tunic: 0x3a7ad8, tunic2: 0x24508a, pants: 0x6a4a2a, boots: 0x4a2a14 },
  { tunic: 0x3a9a4a, tunic2: 0x24602a, pants: 0x5a4028, boots: 0x3a2412, band: 0xe23b2e, pads: 0x8a5a2a },
  { tunic: 0xb8c0cc, tunic2: 0x6a7280, pants: 0x3a3a48, boots: 0x2a2a34, metal: 0xc0c8d4, helmet: 0xa8b0bc, cape: 0xd8302a, pads: 0xa8b0bc },
  { tunic: 0xeef2f8, tunic2: 0x9aa4b4, pants: 0x2a3a6a, boots: 0x1a2a4a, metal: 0xf0f4fa, helmet: 0xe8eef6, horns: 0xffc531, cape: 0x2a5ad8, pads: 0xffc531, trim: 0xffc531 },
  { tunic: 0xffc531, tunic2: 0xb8800c, pants: 0x4a1a6a, boots: 0x2a0e3a, metal: 0xffd24a, crown: 0xffd24a, cape: 0x8a2ad8, pads: 0xffd24a, wings: 0xffffff, aura: 0xffe14d, trim: 0xff5ad8 },
];

const start = () => {
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => n < 1000 ? String(Math.floor(n)) : n < 10000 ? (Math.floor(n / 100) / 10).toFixed(1).replace(/\.0$/, '') + 'K' : Math.floor(n / 1000) + 'K';
const lerpAngle = (a, b, t) => { let d = b - a; while (d > PI) d -= PI * 2; while (d < -PI) d += PI * 2; return a + d * t; };
const sizeOf = (power, base = 1) => base * 0.5 * Math.cbrt(Math.max(1, power));

/* ---------------- 9:16 stage + renderer ---------------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
