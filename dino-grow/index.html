<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  /* One prehistoric look on purpose: the game is its own world, not themed by the host. */
  :root{
    --ink:#1c1a14; --bone:#f4ead2; --leaf:#5fae3a; --eat:#7dff6a; --near:#ffd23a; --danger:#ff5a46; --ember:#ff7a1a;
    --panel:rgba(20,18,12,.72); --font:"Lilita One",ui-rounded,"Segoe UI",system-ui,sans-serif; color-scheme:dark;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1c;color:var(--bone);font-family:var(--font);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none}
  #hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(200,10,0,.75) 100%)}
  #ramp{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,120,0,0) 55%,rgba(255,90,0,.45) 100%)}
  #flash{position:absolute;inset:0;background:#fffbe8;opacity:0}
  #top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .left{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .pow{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;padding:2px 14px 0 8px;font-size:30px;line-height:1.15;
    font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .pow .bolt{font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
  .pow.ramp b{color:var(--ember)}
  .pow.bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.12)}}
  .evo{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:3px 10px 1px 6px;font-size:14px}
  .evo i{display:block;width:96px;height:9px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
  .evo u{display:block;height:100%;width:0;background:linear-gradient(90deg,#9be15d,#ffe14d);transition:width .2s}
  .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
  .path{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:3px 10px}
  .path span{font-size:20px;line-height:1;opacity:.35;filter:grayscale(1);transition:all .3s}
  .path span.on{opacity:1;filter:none;transform:scale(1.25)}
  .path span.done{opacity:.85;filter:none}
  .path i{display:block;width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
  #boss{display:none;align-items:center;gap:6px;background:rgba(60,8,0,.8);border-radius:999px;padding:3px 10px;font-size:18px}
  #boss i{display:block;width:150px;height:11px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
  #boss u{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b1a,#ffb21a);transition:width .25s}
  #tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto;justify-self:end}
  #tools button{font:15px/1 var(--font);color:var(--ink);background:var(--bone);border:2px solid #6b4a22;border-radius:10px;padding:7px 10px 5px;
    cursor:pointer;box-shadow:0 2px 0 #6b4a22;min-width:118px;text-align:left}
  #tools #bGear{min-width:0;width:40px;height:40px;padding:0;text-align:center;font-size:20px;border-radius:50%}
  #tools button:focus-visible,#bSkill:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #tools .panel{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #tools .panel[hidden]{display:none}
  #bSkill{position:absolute;right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
    width:92px;height:92px;border-radius:50%;border:0;padding:0;pointer-events:auto;cursor:pointer;
    background:conic-gradient(var(--ember) calc(var(--c,0)*1turn),rgba(255,255,255,.15) 0);box-shadow:0 5px 0 rgba(0,0,0,.35)}
  #bSkill .ic{position:absolute;inset:7px;border-radius:50%;background:#3a2414;display:grid;place-items:center;font-size:40px;filter:grayscale(.8);transition:filter .2s}
  #bSkill.ready .ic{filter:none;background:radial-gradient(circle,#ff9a3d,#c2410c);animation:pulse .8s ease-in-out infinite}
  #bSkill.active .ic{filter:none;background:radial-gradient(circle,#ffd23a,#ff5a1a)}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.5);display:none}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}
  #tut{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);transition:opacity .4s}
  #tut .hand{font-size:56px;display:inline-block;animation:swipe 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
  @keyframes swipe{0%,100%{transform:translateX(-46px) rotate(-8deg)}50%{transform:translateX(46px) rotate(8deg)}}
  #banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;transition:all .25s;
    text-shadow:0 4px 0 rgba(0,0,0,.45)}
  #banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner .big{font-size:64px;line-height:1;color:#ffe14d}
  #banner .sm{font-size:24px;line-height:1.1;color:var(--bone)}
  .lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
  .pw{font-size:16px;line-height:1;padding:3px 7px 1px;border-radius:8px;background:rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
  .pw.eat{color:var(--eat)} .pw.near{color:var(--near)} .pw.danger{color:var(--danger);background:rgba(70,0,0,.6)}
  .pw.me{font-size:21px;color:#fff;background:rgba(0,0,0,.55)} .pw.me.ramp{color:var(--ember)}
  .pw.boss{font-size:24px;padding:4px 10px 2px}
  .float{font-size:24px;color:var(--eat);text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .float.bad{color:var(--danger)}
  #end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,2,.55);pointer-events:auto;
    padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  #end .card{background:#2a1d10;border:4px solid #ffb21a;border-radius:22px;padding:18px 30px 16px;text-align:center;box-shadow:0 8px 0 #7a3a06}
  #end h2{margin:0;font-size:64px;line-height:1}
  #end p{margin:6px 0 12px;font-size:24px;font-variant-numeric:tabular-nums}
  #end button{font:28px/1 var(--font);border:0;border-radius:14px;padding:10px 26px 6px;cursor:pointer;background:#ffb21a;color:var(--ink);box-shadow:0 4px 0 #7a3a06}
  @media (prefers-reduced-motion:reduce){#tut .hand,#bSkill.ready .ic{animation:none}}
</style>
</head>
<body>
<div id="ui">
  <div id="ramp"></div><div id="hurt"></div>
  <div id="labels"></div>
  <div id="top">
    <div class="left">
      <div class="pow" id="powPill"><span class="bolt">⚡</span><b id="pw">1</b></div>
      <div class="evo"><span id="evoLv">LV1</span><i><u id="evoBar"></u></i><span>🦖</span></div>
    </div>
    <div class="mid">
      <div class="path" id="path"><span>🌴</span><i></i><span>🐸</span><i></i><span>🌋</span></div>
      <div id="boss"><span>👑</span><i><u id="bossBar"></u></i></div>
    </div>
    <div id="tools">
      <button id="bGear" type="button" aria-label="Công cụ kiểm tra">⚙</button>
      <div class="panel" id="toolPanel" hidden>
        <button id="bPow" type="button">⚡ Sức mạnh ×2</button>
        <button id="bFill" type="button">💥 Đầy kỹ năng</button>
        <button id="bNext" type="button">⏭ Màn sau</button>
      </div>
    </div>
  </div>
  <button id="bSkill" type="button" aria-label="Kỹ năng gầm"><span class="ic">💥</span></button>
  <div id="tut"><div class="hand">👆</div></div>
  <div id="banner"><div class="big" id="bnBig"></div><div class="sm" id="bnSm"></div></div>
  <div id="joy"><i></i></div>
  <div id="flash"></div>
  <div id="end"><div class="card"><h2>🏆</h2><p id="endStats"></p><button id="bRestart" type="button" aria-label="Chơi lại">↻</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
/* =====================================================================

   Map convention: start SOUTH, danger rises going NORTH; each level ends at a portal
   in the north, the last level ends in a boss arena. Core rule: power number <= yours = food.
   Size follows power (scale ~ cube root), the camera follows size.
   Rigs: THEROPOD (biped dinos) and QUADRUPED — standard bone names, see buildTheropod/buildQuad.
   ===================================================================== */

    { id: 'volcano', icon: '🌋', w: 100, h: 124, start: [0, 54], arena: [0, -42], arenaR: 17, range: [120, 3200],
      boss: { power: 2500, hp: 6 },

      sky: [0x6a3a2c, 0xd08a5a], fog: 0x7a4a36, sun: 0xffc49a, ground: [0x2e2824, 0x3e3330, 0x5a3424] },

// species: kind = builder, range = power range, h = label height per unit scale, rad = hitbox
const SPECIES = {

const LOOKS = {
  baby:      { top: 0x8a6a3e, belly: 0xe8d2a8, stripe: 0x4a3520, head: 1.4, neck: 0.9, tail: 0.85, bulk: 0.95, feathers: 0xc98a4a, eye: 0xffc93a },

  allo:      { top: 0xa0622e, belly: 0xe8c9a0, stripe: 0x5a3418, brow: true, head: 1.1, bulk: 1.1 },
  carno:     { top: 0x9a2f22, belly: 0xe0b49a, stripe: 0x4a1410, horns: true, arms: 0.5, bulk: 1.15, head: 1.05 },

  compy:     { top: 0x6f8f4a, belly: 0xe9e3c0, stripe: 0x34451f, head: 1.1, bulk: 0.85, neck: 1.1 },
  raptorNpc: { top: 0x7a4a2a, belly: 0xe0c8a0, stripe: 0x2a1a0e, feathers: 0x8a2a1a, claw: true },

  proto:     { top: 0xb08a5a, belly: 0xeadbb8, stripe: 0x6a4a2a, frill: 'small', beak: true, bulk: 0.9 },

  stego:     { top: 0x7a8a4a, belly: 0xd8d2a8, stripe: 0x3a4220, plates: 0xc85a2a, tailSpikes: true, head: 0.7, bulk: 1.1 },
  croc:      { top: 0x3e4a2e, belly: 0xb8b088, stripe: 0x1e2614, snout: 2.4, legs: 0.42, flat: true, tail: 1.6, head: 0.95, len: 1.2 },
  ankylo:    { top: 0x6a5a4a, belly: 0xc8b89a, stripe: 0x3a2e24, armor: 0x8a7a5a, club: true, legs: 0.7, bulk: 1.2, flatTop: true, head: 0.85 },
  trike:     { top: 0x8a6a4a, belly: 0xe0cfa8, stripe: 0x4a3422, frill: 'big', horns3: true, beak: true, bulk: 1.15, head: 1.1 },
};

const start = () => {
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;
const hash = x => { const s = Math.sin(x * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const fmt = n => n < 1000 ? String(Math.floor(n)) : n < 10000 ? (Math.floor(n / 100) / 10).toFixed(1).replace(/\.0$/, '') + 'K' : Math.floor(n / 1000) + 'K';
const sizeOf = (power, base = 1) => base * 0.42 * Math.cbrt(Math.max(1, power));
const lerpAngle = (a, b, t) => { let d = b - a; while (d > PI) d -= PI * 2; while (d < -PI) d += PI * 2; return a + d * t; };

/* ---------------- renderer: semi-realistic (PBR + filmic tone mapping) ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xa9cbb0, 30, 120);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
const hemi = new THREE.HemisphereLight(0xdfeeff, 0x4a5a2a, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d2, 2.0); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; scene.add(sun); scene.add(sun.target);
const setSRGB = t => { if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding; return t; };
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = setSRGB(new THREE.CanvasTexture(c)); t.anisotropy = 4; return t; }

/* ---------------- audio (synth) ---------------- */
let actx = null, noiseBuf = null;
function beep(f, d = 0.08, type = 'sine', v = 0.05, f2) {
  if (!actx) return; const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; if (f2) o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + d);
  g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
}
function noise(d = 0.25, f = 900, q = 1, v = 0.15, type = 'bandpass') {
  if (!actx) return; const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = type; bp.frequency.value = f; bp.Q.value = q;
  const g = actx.createGain(); g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
  s.connect(bp).connect(g).connect(actx.destination); s.start(0, Math.random()); s.stop(actx.currentTime + d);
}
const sfx = {
  chomp: s => { noise(0.12, 1400, 1.2, 0.2); beep(160 / Math.sqrt(s), 0.1, 'square', 0.04); },
  stomp: s => { beep(70 / Math.sqrt(s) + 20, 0.16, 'sine', Math.min(0.12, 0.03 * s)); },
  hurt: () => { beep(240, 0.3, 'sawtooth', 0.06, 90); noise(0.2, 600, 1, 0.12); },
  roar: () => { noise(1.0, 260, 0.7, 0.35, 'lowpass'); beep(110, 0.9, 'sawtooth', 0.07, 55); },
  evolve: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.06), i * 80)); },
};
const unlockAudio = () => {
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } catch (e) {}
};
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);

/* ---------------- geometry helpers ---------------- */
const skinMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.02 });
const propMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.9, side: THREE.DoubleSide });   // low props: ferns, bushes, rocks
const tallMat = propMat.clone();                                                                                    // tall props: trees, palms, columns
// see-through: tall props between the camera and the player are dithered away so the player never gets hidden
const seeThru = { uCam: { value: new V3() }, uPly: { value: new V3() }, uRad: { value: 2 } };
tallMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, seeThru);

const camPos = new V3(), camLook = new V3();
let lastShadow = 0;

  const dist = camDist(), dir = new V3(0, 0.68, 0.74).normalize();
  const want = PLY.pos.clone().addScaledVector(dir, dist), look = PLY.pos.clone().add(new V3(0, PLY.scale * 0.9, -PLY.scale * 1.4));
  camPos.lerp(want, snap ? 1 : Math.min(1, dt * 3.5)); camLook.lerp(look, snap ? 1 : Math.min(1, dt * 5));

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------------- level flow ---------------- */

/* ---------------- main loop ---------------- */
const arrow = new THREE.Group(); scene.add(arrow);
const am = new THREE.MeshBasicMaterial({ color: 0x8affe0 });
addMesh(new THREE.ConeGeometry(0.5, 0.9, 4), am, arrow, 0, 0, 0, false).rotation.x = PI; addMesh(new THREE.BoxGeometry(0.3, 0.7, 0.3), am, arrow, 0, 0.75, 0, false);
const pointer = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.9, 3), new THREE.MeshBasicMaterial({ color: 0x8affe0, transparent: true, opacity: 0.8 })); pointer.rotation.x = PI / 2; pointer.scale.z = 0.25;
const pointerG = new THREE.Group(); pointerG.add(pointer); pointer.position.z = 1.6; scene.add(pointerG);
loadLevel(0);
let last = performance.now(), T = 0, spawnCd = 0;

    if (Math.random() < dt * 8) particle(p.clone().setY(0.2), PLY.scale * 0.1, new V3(rnd(-1, 1), 3, rnd(-1, 1)), chunkMats.ember, 0.6, 3);
