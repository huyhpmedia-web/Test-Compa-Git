<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frozen River Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* One cold, sunny winter look on purpose: the camp is its own world, not themed by the host. */
  :root{
    --ice:#5cc8f0; --ice-deep:#1f6fa8; --ink:#1d2b3a; --snow:#f4f8fc; --ember:#ff7a1a; --gold:#ffc531;
    --panel:rgba(18,38,62,.84); --good:#3fbf55; --bad:#e2493b; --cold:#57b6f2;
    --font:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#86c9ef;color:var(--ink);font-family:var(--font);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none}
  #frost{position:absolute;inset:0;opacity:0;
    background:radial-gradient(ellipse at center,rgba(255,255,255,0) 42%,rgba(214,234,252,.7) 78%,rgba(242,249,255,.96) 100%)}
  #top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .pills{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .mid{display:flex;flex-direction:column;gap:6px;align-items:center}
  .pill{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--snow);border-radius:999px;
    padding:3px 14px 3px 4px;font-weight:800;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0a8,#ffc531 55%,#c98a06);
    display:grid;place-items:center;color:#7a4500;font-size:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .pill.small{font-size:15px;padding:2px 12px 2px 4px}
  .pill.small .coin{width:22px;height:22px;font-size:13px;background:radial-gradient(circle at 35% 30%,#ffffff,#bfe6fb)}
  .pill.lvl{padding:2px 12px;font-size:15px}
  .pill.bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.12)}}
  #storm{padding:3px 10px;gap:6px;opacity:0;transition:opacity .3s}
  #storm.warn{animation:blink .45s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #storm i{display:block;width:70px;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  #storm u{display:block;height:100%;width:100%;background:#bfe6fb}
  #tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto;justify-self:end}
  #tools button{font:700 13px/1 var(--font);color:var(--ink);background:var(--snow);border:2px solid var(--ice-deep);
    border-radius:10px;padding:7px 10px 5px;cursor:pointer;box-shadow:0 2px 0 var(--ice-deep);min-width:112px;text-align:left}
  #tools button.on{background:#bfe6fb}
  #tools button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #tools #bGear{min-width:0;width:40px;height:40px;padding:0;text-align:center;font-size:20px;border-radius:50%}
  #tools .panel{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #tools .panel[hidden]{display:none}
  #joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.6);display:none}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #tut{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);transition:opacity .4s}
  #tut .hand{font-size:56px;display:inline-block;animation:swipe 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
  @keyframes swipe{0%,100%{transform:translateX(-46px) rotate(-8deg)}50%{transform:translateX(46px) rotate(8deg)}}
  .lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
  .pad{display:flex;flex-direction:column;align-items:center;font-weight:800;line-height:1}
  .pad .ic{width:54px;height:54px;border-radius:50%;background:var(--snow);border:3px solid var(--ice-deep);display:grid;place-items:center;
    font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .pad .pr{margin-top:-8px;background:var(--ice-deep);color:#fff;border-radius:999px;padding:3px 10px 1px;font-size:17px;
    box-shadow:0 3px 0 rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
  .pad.ok .ic{border-color:var(--good)} .pad.ok .pr{background:var(--good)}
  .bubble{background:#fff;border-radius:12px;padding:2px 8px 4px;font-weight:800;font-size:14px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .bubble i{display:block;height:5px;width:46px;border-radius:3px;background:#dfe7ee;overflow:hidden;margin-top:1px}
  .bubble u{display:block;height:100%}
  .face{font-size:28px}
  .fuel{display:flex;align-items:center;gap:4px;background:var(--panel);border-radius:999px;padding:2px 8px 2px 4px;font-size:16px}
  .fuel i{display:block;width:44px;height:7px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  .fuel u{display:block;height:100%;background:linear-gradient(90deg,#ff5a1a,#ffc531)}
  .maxtag{background:var(--bad);color:#fff;border-radius:8px;padding:1px 7px 0;font-weight:800;font-size:12px}
  .float{font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #1f6fa8,0 0 6px rgba(0,0,0,.25)}
  #fade{position:absolute;inset:0;background:var(--snow);opacity:0;display:grid;place-items:center;transition:opacity .45s}
  #fade .badge{font-size:84px;line-height:1;text-align:center;font-weight:800;color:var(--ice-deep)}
  #fade .badge b{display:block;font-size:44px;margin-top:6px}
  #end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,28,46,.45);pointer-events:auto;
    padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  #end .card{background:var(--snow);border:4px solid var(--ice);border-radius:22px;padding:18px 30px 16px;text-align:center;
    box-shadow:0 8px 0 var(--ice-deep)}
  #end h2{margin:0;font-size:64px;line-height:1}
  #end p{margin:6px 0 12px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  #end button{font:800 26px/1 var(--font);border:0;border-radius:14px;padding:10px 26px 7px;cursor:pointer;background:var(--gold);
    color:var(--ink);box-shadow:0 4px 0 #c98a06}
  @media (prefers-reduced-motion:reduce){#tut .hand,#storm.warn{animation:none}}
</style>
</head>
<body>
<div id="ui">
  <div id="frost"></div>
  <div id="labels"></div>
  <div id="top">
    <div class="pills">
      <div class="pill" id="moneyPill"><span class="coin">$</span><span id="money">0</span></div>
      <div class="pill small" id="stackPill"><span class="coin" id="stackIcon">·</span><span id="stack">0/6</span></div>
    </div>
    <div class="mid">
      <div class="pill lvl" id="lvl">🎣 1/3</div>
      <div class="pill" id="storm"><span>❄️</span><i><u id="stormBar"></u></i></div>
    </div>
    <div id="tools">
      <button id="bGear" type="button" aria-label="Công cụ xem bố cục">⚙</button>
      <div class="panel" id="toolPanel" hidden>
        <button id="bLayout" type="button">▦ Bố cục</button>
        <button id="bView" type="button">◎ Toàn cảnh</button>
        <button id="bMode" type="button">👥 Hàng dài</button>
        <button id="bStorm" type="button">❄️ Bão tuyết</button>
        <button id="bCash" type="button">+ $100 (test)</button>
        <button id="bNext" type="button">⏭ Màn sau</button>
      </div>
    </div>
  </div>
  <div id="tut"><div class="hand">👆</div></div>
  <div id="joy"><i></i></div>
  <div id="fade"><div class="badge" id="fadeBadge"></div></div>
  <div id="end"><div class="card"><h2>🏆</h2><p id="endStats"></p><button id="bRestart" type="button" aria-label="Chơi lại">↻</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
/* =====================================================================
   FROZEN RIVER CAMP — template "carry-stack tycoon" (same map convention as Honey Farm)
     WEST   = resource  : frozen river, ice blocks with fish inside (attack to harvest)
     CENTER = processing: camp kitchen (fish -> soup), furnace, unlock stations
     EAST   = customers : long line of freezing villagers
     NORTH / SOUTH = scenery + expansion (sawmill north, tents south)
   Game data lives in CONFIG. Each level = new outpost with its own numbers.
   ===================================================================== */
const CONFIG = {
  template: 'carry-stack-tycoon',
  theme: { name: 'Frozen River Camp', resourceIcon: '🐟', productIcon: '🍲', fuelIcon: '🪵' },
  layout: {
    bounds: { minX: -17, maxX: 17, minZ: -10, maxZ: 10 },
    playerArea: { minX: -16.3, maxX: 7.2, minZ: -9.3, maxZ: 9.3 },
    zones: [
      { id: 'west',   label: 'TÂY · NGUỒN NGUYÊN LIỆU', sub: 'Sông băng · khối băng có cá', x0: -17, x1: -6.4, z0: -6, z1: 6, color: 0x1f8fe8 },
      { id: 'center', label: 'TRUNG TÂM · CHẾ BIẾN', sub: 'Bếp nấu · lò sưởi · trạm', x0: -6.4, x1: 7.6, z0: -6, z1: 6, color: 0xff6a1a },
      { id: 'east',   label: 'ĐÔNG · KHÁCH HÀNG', sub: 'Dân làng xếp hàng', x0: 7.6, x1: 17, z0: -6, z1: 6, color: 0x8e5bd8 },
      { id: 'north',  label: 'BẮC · XƯỞNG CƯA + CẢNH QUAN', sub: 'Khu mở rộng', x0: -17, x1: 17, z0: -10, z1: -6, color: 0x2fae6a },
      { id: 'south',  label: 'NAM · LỀU TRẠI + CẢNH QUAN', sub: 'Trang trí', x0: -17, x1: 17, z0: 6, z1: 10, color: 0x2fae6a },
    ],
  },
  items: { scale: 1.5 },
  player: { speed: 5.3, capacity: 6, start: [-3, 3], swing: 0.42, dmg: 1, reach: 1.45 },
  kitchen: { pos: [0, 0], input: [-2.1, 2.3], output: [2.6, 0.4], cook: 0.7, outMax: 12 },
  counter: { x: 8, halfLen: 2.2, serve: [6.5, 0], serveZone: { minX: 5.4, maxX: 7.4, minZ: -2.6, maxZ: 2.6 }, cash: [5.7, -4.1] },
  sawmill: { pos: [0, -8.5], output: [2.8, -6.8], every: 2.4, max: 8 },
  furnace: { pos: [4.7, 5.0], feed: [3.05, 5.0], burn: 7, max: 8, startFuel: 3 },
  workers: { cap: 4, speed: 3.7 },
  villagers: { spawnX: 19.5, queueRow: 8, spacing: 0.82, mode: 'queue' },
  levels: [
    { name: 'Frozen Creek', badge: '🎣', sky: 0x7cc4ee, fog: 0xcfe6f6, sun: 0xfff2dc, iceCol: 0x3ea6dc, decor: 'creek',
      ice: { hp: 3, fish: [1, 2], respawn: 4, size: 1,
        start: [[-9.0, -1.8], [-9.0, 1.8], [-11.8, -1.8], [-11.8, 1.8]],
        extra: [[-14.6, -1.8], [-14.6, 1.8], [-10.4, -5.0], [-13.2, -5.0]] },
      soupPrice: 8, villagers: { start: 7, max: 15, every: [1.2, 2.2], patience: 46 },
      blizzard: { first: 26, every: 38, dur: 9, power: 0.7 },
      unlocks: [
        { id: 'ice',     icon: '🧊', price: 20,  pos: [-12.0, -7.4] },
        { id: 'sawmill', icon: '🪚', price: 35,  pos: [0, -6.9] },
        { id: 'furnace', icon: '🔥', price: 55,  pos: [4.7, 5.0] },
        { id: 'fisher',  icon: '👷', price: 75,  pos: [-4.6, 5.0] },
        { id: 'next',    icon: '🛷', price: 100, pos: [1.0, 7.3] },
      ] },
    { name: 'Pine Outpost', badge: '🌲', sky: 0x9fb8de, fog: 0xd8e1f0, sun: 0xfff0e0, iceCol: 0x3898cf, decor: 'pine',
      ice: { hp: 5, fish: [2, 3], respawn: 3.5, size: 1.08,
        start: [[-9.2, -2.4], [-9.2, 2.4], [-11.9, 0], [-14.6, -2.4], [-14.6, 2.4]],
        extra: [[-11.9, -4.8], [-11.9, 4.8], [-9.2, -5.9], [-14.6, 5.4]] },
      soupPrice: 12, villagers: { start: 9, max: 16, every: [1.0, 1.9], patience: 42 },
      blizzard: { first: 14, every: 30, dur: 11, power: 1.0 },
      unlocks: [
        { id: 'sawmill', icon: '🪚', price: 40,  pos: [0, -6.9] },
        { id: 'furnace', icon: '🔥', price: 60,  pos: [4.7, 5.0] },
        { id: 'ice',     icon: '🧊', price: 70,  pos: [-12.0, -7.6] },
        { id: 'pickaxe', icon: '⛏️', price: 85,  pos: [-4.6, -4.6] },
        { id: 'fisher',  icon: '👷', price: 100, pos: [-4.6, 5.0] },
        { id: 'waiter',  icon: '🧑‍🍳', price: 120, pos: [3.4, -3.2] },
        { id: 'next',    icon: '🛷', price: 150, pos: [1.0, 7.3] },
      ] },
    { name: 'Glacier Bay', badge: '🏔️', sky: 0xf0bfcd, fog: 0xf6dce3, sun: 0xffd6ad, iceCol: 0x4aaedf, decor: 'glacier',
      ice: { hp: 7, fish: [3, 4], respawn: 3, size: 1.16,
        start: [[-9.4, -3.2], [-9.4, 0], [-9.4, 3.2], [-12.6, -3.2], [-12.6, 0], [-12.6, 3.2]],
        extra: [[-15.3, -1.6], [-15.3, 1.6], [-11.0, -6.3], [-11.0, 6.3]] },
      soupPrice: 16, villagers: { start: 11, max: 18, every: [0.8, 1.6], patience: 40 },
      blizzard: { first: 10, every: 24, dur: 12, power: 1.25 },
      unlocks: [
        { id: 'furnace', icon: '🔥', price: 50,  pos: [4.7, 5.0] },
        { id: 'sawmill', icon: '🪚', price: 60,  pos: [0, -6.9] },
        { id: 'pickaxe', icon: '⛏️', price: 80,  pos: [-4.6, -4.6] },
        { id: 'fisher',  icon: '👷', price: 100, pos: [-4.6, 5.0] },
        { id: 'waiter',  icon: '🧑‍🍳', price: 120, pos: [3.4, -3.2] },
        { id: 'lumber',  icon: '🪓', price: 140, pos: [-1.8, -4.8] },
        { id: 'ice',     icon: '🧊', price: 160, pos: [-13.0, -8.2] },
        { id: 'trophy',  icon: '🏆', price: 200, pos: [1.0, 7.3] },
      ] },
  ],
};

const start = () => {
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7cc4ee);
scene.fog = new THREE.Fog(0xcfe6f6, 60, 140);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
// low bluish fill + strong warm key: snow stays bright, shadows read cold blue
const hemi = new THREE.HemisphereLight(0xe6f3ff, 0x6c8fbf, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 1.3);
sun.position.set(14, 28, 14); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.bias = -0.0008; scene.add(sun);

const setSRGB = t => { if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding; return t; };
const TOON = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
TOON.minFilter = TOON.magFilter = THREE.NearestFilter; TOON.needsUpdate = true;
const matCache = {};
const mat = (c, extra) => {
  const k = c + (extra ? JSON.stringify(extra) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: TOON }, extra || {})));
};
function mk(geo, m, parent, x = 0, y = 0, z = 0, cast = true) {
  const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
  o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true;
  if (parent) parent.add(o);
  return o;
}
const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CYL = (rt, rb, h, s = 14) => new THREE.CylinderGeometry(rt, rb, h, s);
const SPH = (r, w = 14, h = 10) => new THREE.SphereGeometry(r, w, h);
const CAP = (r, l) => new THREE.CapsuleGeometry(r, l, 4, 10);
const CONE = (r, h, s = 10) => new THREE.ConeGeometry(r, h, s);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = setSRGB(new THREE.CanvasTexture(c)); t.anisotropy = 4; return t;
}
const FONT = '"Baloo 2", ui-rounded, system-ui, sans-serif';

/* ---------------- audio (synth only, no files) ---------------- */
let actx = null, noiseBuf = null, wind = null;
function beep(f, d = 0.07, type = 'sine', v = 0.05) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = v;
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
}
function noise(d = 0.25, f = 1800, q = 1, v = 0.18) {
  if (!actx) return;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
  const g = actx.createGain(); g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
  s.connect(bp).connect(g).connect(actx.destination); s.start(0, Math.random()); s.stop(actx.currentTime + d);
}
const unlockAudio = () => {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    const g = actx.createGain(); g.gain.value = 0; s.connect(lp).connect(g).connect(actx.destination); s.start();
    wind = g;
  } catch (e) {}
};
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);

/* ---------------- world container (rebuilt per level) ---------------- */
let W = new THREE.Group(); scene.add(W);
const obstacles = [];
const addCircle = (x, z, r) => { const o = { c: 1, x, z, r }; obstacles.push(o); return o; };
const addBox = (x0, x1, z0, z1) => { const o = { c: 0, x0, x1, z0, z1 }; obstacles.push(o); return o; };

/* ---------------- items ---------------- */
const IS = CONFIG.items.scale;
const ITEM_H = { fish: 0.22 * IS, soup: 0.18 * IS, wood: 0.23 * IS, coin: 0.075 };
const G = {
  fish: SPH(1, 12, 8), tail: CONE(0.11, 0.16, 4), fin: CONE(0.05, 0.1, 3), eye: SPH(0.028, 6, 4),
  bowl: CYL(0.2, 0.13, 0.15, 14), soup: CYL(0.185, 0.185, 0.02, 14), bit: BOX(0.05, 0.03, 0.05),
  log: CYL(0.075, 0.075, 0.46, 8), rope: CYL(0.082, 0.082, 0.05, 8), coin: CYL(0.13, 0.13, 0.05, 16),
};
const FISH_COLS = [0xff7a2a, 0x3fa9f5, 0xff5470, 0x9b6cff];
function fishShape(g, col) {

  kitchen = sawmill = furnace = null; villagers = []; workers = []; loose = []; blocks = [];
  money = 0; shownMoney = -1; P.dmg = PL.dmg; P.swing = PL.swing;
  buildGround(); buildDecor(); buildKitchen(); buildCounter();
  blocks = LV.ice.start.map(s => makeBlock(s, true)).concat(LV.ice.extra.map(s => makeBlock(s, false)));
  buildPads();
  for (let k = 0; k < LV.villagers.start; k++) spawnVillager(true);
  spawnT = 1;
  Object.assign(storm, { k: 0, phase: 'calm', next: LV.blizzard.first, left: 0 });
  player.root.position.set(PL.start[0], 0, PL.start[1]); P.heading = 0;
  $('lvl').textContent = `${LV.badge} ${i + 1}/${CONFIG.levels.length}`;
  revealPads(); updateCamera(0, true);
}
function goNextLevel() {
  if (transitioning || levelIdx >= CONFIG.levels.length - 1) return;
  transitioning = true;
  const nx = CONFIG.levels[levelIdx + 1];
  $('fadeBadge').innerHTML = `${nx.badge}<b>${levelIdx + 2}/${CONFIG.levels.length}</b>`;
  $('fade').style.opacity = '1';
  setTimeout(() => { loadLevel(levelIdx + 1); setTimeout(() => { $('fade').style.opacity = '0'; transitioning = false; }, 700); }, 520);
}
function showEnd() {
  if (endShown) return; endShown = true;
  setTimeout(() => { $('endStats').textContent = `🍲 ${totalSold}   ·   $${totalEarned}`; $('end').style.display = 'flex'; confetti(player.root.position.clone(), 60); }, 900);
}
$('bRestart').onclick = () => location.reload();

/* ---------------- tools (review only) ---------------- */
let overview = false;
$('bGear').onclick = e => { const pn = $('toolPanel'); pn.hidden = !pn.hidden; e.currentTarget.classList.toggle('on', !pn.hidden); };
$('bLayout').onclick = e => { if (!overlay) buildOverlay(); else overlay.visible = !overlay.visible; e.currentTarget.classList.toggle('on', overlay.visible); };
$('bView').onclick = e => { overview = !overview; e.currentTarget.classList.toggle('on', overview); };
$('bMode').onclick = e => { custMode = custMode === 'queue' ? 'crowd' : 'queue'; e.currentTarget.textContent = custMode === 'queue' ? '👥 Hàng dài' : '👥 Đám đông'; villagers.forEach(c => { if (c.state !== 'out') c.arrived = false; }); };
$('bStorm').onclick = () => { if (storm.phase === 'storm') storm.left = 0; else storm.next = 0; };
$('bCash').onclick = () => { money += 100; bumpMoney(); };
$('bNext').onclick = () => { if (levelIdx < CONFIG.levels.length - 1) goNextLevel(); };
for (const b of document.querySelectorAll('#tools button')) b.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------------- camera ---------------- */
const camTgt = new V3(PL.start[0], 0, PL.start[1]), camPos = new V3();
function updateCamera(dt, snap) {
  const a = innerWidth / innerHeight, p = player.root.position;
  let want, look;
  if (overview) {
    const hf = Math.atan(Math.tan(20 * PI / 180) * a);
    const dist = Math.max(21 / Math.tan(hf), 13 / Math.tan(20 * PI / 180)) * 1.05;
    look = new V3(0, 0, 0.6); want = look.clone().add(new V3(0, 0.83, 0.56).normalize().multiplyScalar(dist));
  } else {
    const port = a < 1;
    const dist = port ? clamp(6.5 / (Math.tan(20 * PI / 180) * a), 17, 46) : 17.1;
    camTgt.lerp(new V3(clamp(p.x, -13, 11), 0, clamp(p.z, -6.5, 6.5) - (port ? 0.8 : 0)), snap ? 1 : Math.min(1, dt * 5));
    look = camTgt.clone(); want = look.clone().add((port ? new V3(0, 0.9, 0.44) : new V3(0, 13.5, 10.5)).normalize().multiplyScalar(dist));
  }
  camPos.lerp(want, snap ? 1 : Math.min(1, dt * 4));
  const sh = new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(shake);
  camera.position.copy(camPos).add(sh);
  camera.lookAt(camPos.clone().sub(want).add(look).add(sh));
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------------- boot + loop ---------------- */
loadLevel(0);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const mv = moveInput(), p = player.root.position, moving = mv.l > 0.05 && !transitioning;
  if (moving) {
    if (!moved) { moved = true; $('tut').style.opacity = '0'; }
    const sp = PL.speed * (1 - storm.k * 0.28);
    p.x += mv.x * sp * dt; p.z += mv.z * sp * dt;
    P.heading = lerpAngle(P.heading, Math.atan2(mv.x, mv.z), Math.min(1, dt * 14));
  }
  collide(p);
  const atk = transitioning ? -1 : interact(dt, moving);
  player.root.rotation.y = P.heading;
  animHuman(player, dt, { moving, sp: 0.6 + mv.l * 0.5, atk, rest: atk < 0 });
  updateBlocks(dt, T); updateKitchen(dt, T); updateSawmill(dt); updateFurnace(dt, T);
  updateVillagers(dt); for (const w of workers) updateWorker(w, dt);
  updateFlyers(dt); updatePops(dt); updateShards(dt); updatePuffs(dt); updateConfetti(dt); updateFloats(dt);
  shake = Math.max(0, shake - dt * 1.2);
  updateStorm(dt, camTgt); updateGuide(T); updateCamera(dt); updateHUD();
  renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__wf = {
  get money() { return money; }, set money(v) { money = v; }, player, get stack() { return stack; }, get blocks() { return blocks; },
  get pads() { return pads; }, get villagers() { return villagers; }, get workers() { return workers; }, get level() { return levelIdx; },
  get furnace() { return furnace; }, get storm() { return storm; }, get kitchen() { return kitchen; }, loadLevel,
};
};

const fontReady = document.fonts && document.fonts.load ? document.fonts.load('800 40px "Baloo 2"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
</script>
