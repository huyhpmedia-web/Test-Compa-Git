<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Honey Farm Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* Single sunny look on purpose: the farm is its own world, not themed by the host. */
  :root{
    --honey:#f7b21b; --honey-deep:#c97606; --ink:#3b2407; --cream:#fff8e6;
    --leaf:#3f8f35; --sky:#a9def6; --panel:rgba(59,36,7,.82); --good:#58b947; --bad:#e2493b;
    --font:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none}
  #top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .pills{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .pill{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--cream);border-radius:999px;
    padding:3px 14px 3px 4px;font-weight:800;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .coin{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f7b21b 55%,#c97606);
    display:grid;place-items:center;color:#7a4500;font-size:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
  .pill.small{font-size:15px;padding:2px 12px 2px 4px}
  .pill.small .coin{width:22px;height:22px;font-size:13px;background:radial-gradient(circle at 35% 30%,#fff3c4,#e9a21a)}
  .pill.bump{animation:bump .25s}
  @keyframes bump{50%{transform:scale(1.12)}}
  #tools{display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
  #tools button{font:700 13px/1 var(--font);color:var(--ink);background:var(--cream);border:2px solid var(--honey-deep);
    border-radius:10px;padding:7px 10px 5px;cursor:pointer;box-shadow:0 2px 0 var(--honey-deep);min-width:112px;text-align:left}
  #tools button.on{background:var(--honey);}
  #tools button:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:var(--panel);color:var(--cream);padding:6px 18px 4px;border-radius:14px;font-weight:700;font-size:17px;
    white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
  #joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);display:none}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  #tut{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-weight:800;font-size:22px;
    text-shadow:0 2px 0 rgba(0,0,0,.35);transition:opacity .4s}
  #tut .hand{font-size:52px;display:inline-block;animation:swipe 1.6s ease-in-out infinite}
  @keyframes swipe{0%,100%{transform:translateX(-46px) rotate(-8deg)}50%{transform:translateX(46px) rotate(8deg)}}
  .lbl{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
  .pad{background:var(--cream);border:2px solid var(--honey-deep);border-radius:12px;padding:2px 10px 0;text-align:center;
    font-weight:800;font-size:14px;line-height:1.15;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .pad b{display:block;font-size:12px;color:var(--honey-deep)}
  .pad.ok{border-color:var(--good)} .pad.ok b{color:var(--leaf)}
  .bubble{background:#fff;border-radius:12px;padding:2px 8px 4px;font-weight:800;font-size:14px;text-align:center;
    box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .bubble i{display:block;height:5px;width:46px;border-radius:3px;background:#e7dccb;overflow:hidden;margin-top:1px}
  .bubble u{display:block;height:100%;background:var(--good)}
  .face{font-size:26px}
  .float{font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #3d7a1f,0 0 6px rgba(0,0,0,.25)}
  .maxtag{background:var(--bad);color:#fff;border-radius:8px;padding:1px 7px 0;font-weight:800;font-size:12px}
  #end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,24,4,.45);pointer-events:auto;
    padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  #end .card{background:var(--cream);border:4px solid var(--honey);border-radius:22px;padding:22px 26px 18px;text-align:center;max-width:340px;
    box-shadow:0 8px 0 var(--honey-deep)}
  #end h2{margin:0;font-size:30px;line-height:1.1;text-wrap:balance}
  #end p{margin:8px 0 14px;font-size:16px}
  #end button{font:800 18px/1 var(--font);border:0;border-radius:14px;padding:12px 22px 9px;margin:4px;cursor:pointer}
  #end .go{background:var(--honey);color:var(--ink);box-shadow:0 4px 0 var(--honey-deep)}
  #end .alt{background:#e9dcc0;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){#tut .hand{animation:none}}
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <div class="pills">
      <div class="pill" id="moneyPill"><span class="coin">$</span><span id="money">0</span></div>
      <div class="pill small" id="stackPill"><span class="coin" id="stackIcon">·</span><span id="stack">0/6</span></div>
    </div>
    <div id="tools">
      <button id="bLayout" type="button">▦ Bố cục</button>
      <button id="bView" type="button">◎ Toàn cảnh</button>
      <button id="bMode" type="button">👥 Hàng dài</button>
      <button id="bCash" type="button">+ $100 (test)</button>
    </div>
  </div>
  <div id="labels"></div>
  <div id="tut"><div class="hand">👆</div><div>Kéo để di chuyển</div></div>
  <div id="hint">Đến tổ ong lấy hũ mật</div>
  <div id="joy"><i></i></div>
  <div id="end"><div class="card">
    <h2>Trang trại hoàn chỉnh!</h2>
    <p id="endStats"></p>
    <button class="go" id="bKeep" type="button">Chơi tiếp</button>
    <button class="alt" id="bRestart" type="button">Chơi lại</button>
  </div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
/* =====================================================================
   HONEY FARM — template "carry-stack tycoon"
   Everything game-specific lives in CONFIG. The engine below reads it.
   Map convention:  WEST = resource · CENTER = processing · EAST = customers
                    NORTH / SOUTH = scenery.   +x = East, -z = North.
   ===================================================================== */
const CONFIG = {
  theme: { name: 'Honey Farm', resource: 'Hũ mật', product: 'Thùng mật', resourceIcon: '🍯', productIcon: '📦' },
  layout: {
    bounds: { minX: -17, maxX: 17, minZ: -10, maxZ: 10 },
    playerArea: { minX: -16.3, maxX: 7.2, minZ: -9.3, maxZ: 9.3 },
    zones: [
      { id: 'west',   label: 'TÂY · NGUỒN NGUYÊN LIỆU', sub: 'Tổ ong (mỏ / chuồng / cây)', x0: -17, x1: -6, z0: -6, z1: 6, color: 0xffa000 },
      { id: 'center', label: 'TRUNG TÂM · CHẾ BIẾN',     sub: 'Máy đóng gói + băng chuyền', x0: -6, x1: 7.6, z0: -6, z1: 6, color: 0xff5a36 },
      { id: 'east',   label: 'ĐÔNG · KHÁCH HÀNG',        sub: 'Quầy bán + hàng chờ / đám đông', x0: 7.6, x1: 17, z0: -6, z1: 6, color: 0x2f8fe8 },
      { id: 'north',  label: 'BẮC · CẢNH QUAN',          sub: 'Trang trí + khu mở rộng', x0: -17, x1: 17, z0: -10, z1: -6, color: 0x3fae4a },
      { id: 'south',  label: 'NAM · CẢNH QUAN',          sub: 'Trang trí', x0: -17, x1: 17, z0: 6, z1: 10, color: 0x3fae4a },
    ],
  },
  player: { speed: 5.4, capacity: 6, start: [-3, 4] },
  resource: { slots: [[-10.5, -2.6], [-10.5, 2.6], [-14, -2.6], [-14, 2.6]], startActive: 2, interval: 2.1, trayMax: 6 },
  processor: { pos: [0, 0], time: 0.85, outMax: 12, input: [-0.9, 2.15], output: [2.5, 0] },
  conveyor: { x0: -8.8, x1: -1.35, z: 0, speed: 1.6, max: 12 },
  counter: { x: 8, halfLen: 2.2, serve: [6.5, 0], serveZone: { minX: 5.4, maxX: 7.4, minZ: -2.6, maxZ: 2.6 }, cash: [5.7, -4.2] },
  customers: { mode: 'queue', maxQueue: 7, maxCrowd: 9, patience: 40, demand: [1, 3], spawnEvery: [2.2, 4.2], price: 12, spawnX: 19.5 },
  unlocks: [
    { id: 'hive3',    name: 'Tổ ong #3',    icon: '🐝', price: 30,  pos: [-14, -2.6] },
    { id: 'conveyor', name: 'Băng chuyền',  icon: '⚙️', price: 60,  pos: [-5, 1.5] },
    { id: 'hive4',    name: 'Tổ ong #4',    icon: '🐝', price: 80,  pos: [-14, 2.6] },
    { id: 'flowers',  name: 'Vườn hoa',     icon: '🌼', price: 100, pos: [-10.5, -6.4] },
    { id: 'machine2', name: 'Máy nhanh x2', icon: '⚡', price: 140, pos: [2.7, 2.8] },
  ],
};

const start = () => {
const V3 = THREE.Vector3;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PI = Math.PI;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9def6);
scene.fog = new THREE.Fog(0xa9def6, 55, 130);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xeaf7ff, 0x6f9446, 0.9));
const sun = new THREE.DirectionalLight(0xfff0cf, 0.95);
sun.position.set(14, 28, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.bias = -0.0008;
scene.add(sun);

const setSRGB = t => { if ('colorSpace' in t) t.colorSpace = THREE.SRGBColorSpace; else t.encoding = THREE.sRGBEncoding; return t; };
const matCache = {};
const mat = (c, extra) => {
  const k = c + (extra ? JSON.stringify(extra) : '');
  return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {})));
};
function mk(geo, m, parent, x = 0, y = 0, z = 0, cast = true) {
  const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
  o.position.set(x, y, z); o.castShadow = cast; o.receiveShadow = true;
  if (parent) parent.add(o);
  return o;
}
const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const CYL = (rt, rb, h, s = 14) => new THREE.CylinderGeometry(rt, rb, h, s);
const SPH = (r, w = 14, h = 10) => new THREE.SphereGeometry(r, w, h);
const CAP = (r, l) => new THREE.CapsuleGeometry(r, l, 4, 10);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = setSRGB(new THREE.CanvasTexture(c)); t.anisotropy = 4; return t;
}
const FONT = '"Baloo 2", ui-rounded, system-ui, sans-serif';

/* ---------------- tiny audio ---------------- */
let actx = null;
function beep(f, d = 0.07, type = 'sine', v = 0.05) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; g.gain.value = v;
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
}
const unlockAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } };
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);

/* ---------------- shared props ---------------- */
const G = {
  jarBody: CYL(0.13, 0.12, 0.22), jarLid: CYL(0.14, 0.14, 0.06), jarBand: CYL(0.132, 0.132, 0.07),
  crate: BOX(0.44, 0.28, 0.36), slat: BOX(0.46, 0.04, 0.38), label: new THREE.PlaneGeometry(0.22, 0.14),
  bill: BOX(0.34, 0.035, 0.18),
};
const jarMat = new THREE.MeshLambertMaterial({ color: 0xf2a007, emissive: 0x6b3a00, emissiveIntensity: 0.35 });
const labelTex = canvasTex(64, 40, (g, w, h) => { g.fillStyle = '#ffd34a'; g.fillRect(0, 0, w, h); g.fillStyle = '#7a4500';
  g.beginPath(); for (let i = 0; i < 6; i++) { const a = i * PI / 3; g.lineTo(32 + Math.cos(a) * 13, 20 + Math.sin(a) * 13); } g.fill(); });
function makeJar() {
  const g = new THREE.Group();
  mk(G.jarBody, jarMat, g, 0, 0.11, 0); mk(G.jarBand, 0xfff3d6, g, 0, 0.12, 0, false); mk(G.jarLid, 0xd84a3a, g, 0, 0.25, 0, false);
  g.userData.kind = 'jar'; return g;
}
function makeCrate() {
  const g = new THREE.Group();
  mk(G.crate, 0xc98b4b, g, 0, 0.14, 0); mk(G.slat, 0x9a6431, g, 0, 0.08, 0, false); mk(G.slat, 0x9a6431, g, 0, 0.22, 0, false);
  const l = mk(G.label, new THREE.MeshBasicMaterial({ map: labelTex }), g, 0, 0.15, 0.183, false); l.receiveShadow = false;
  g.userData.kind = 'crate'; return g;
}
function makeBill(v = 0) { const g = new THREE.Group(); mk(G.bill, 0x56b949, g, 0, 0.02, 0); mk(BOX(0.1, 0.037, 0.1), 0x2f7d2c, g, 0, 0.02, 0, false); g.userData.v = v; return g; }
const ITEM_H = { jar: 0.3, crate: 0.29 };

/* ---------------- flying objects ---------------- */
const flyers = new Set();
function cancelFly(m) { const f = m.userData.fl; if (f) { flyers.delete(f); m.userData.fl = null; } }
function fly(m, parent, local, dur, h, cb) {
  cancelFly(m);
  scene.attach(m);
  const f = { m, parent, local, dur, h, cb, t: 0, from: m.position.clone() };
  m.userData.fl = f; flyers.add(f);
}
function updateFlyers(dt) {
  for (const f of flyers) {
    f.t += dt; const k = Math.min(1, f.t / f.dur);
    let tgt = f.local;
    if (f.parent) { f.parent.updateWorldMatrix(true, false); tgt = f.parent.localToWorld(f.local.clone()); }
    f.m.position.lerpVectors(f.from, tgt, k);
    f.m.position.y += Math.sin(k * PI) * f.h;
    f.m.rotation.y += dt * 6;
    if (k >= 1) {
      flyers.delete(f); f.m.userData.fl = null;
      if (f.parent) { f.parent.add(f.m); f.m.position.copy(f.local); f.m.rotation.set(0, 0, 0); }
      if (f.cb) f.cb();
    }
  }
}
class Pile {
  constructor(parent, x, y, z, o) {
    this.g = new THREE.Group(); this.g.position.set(x, y, z); parent.add(this.g); this.items = [];
    Object.assign(this, { cols: 1, rows: 1, dx: 0.4, dz: 0.4, dy: 0.3 }, o);
  }
  slot(i) {
    const per = this.cols * this.rows, l = Math.floor(i / per), r = i % per, c = r % this.cols, w = Math.floor(r / this.cols);
    return new V3((c - (this.cols - 1) / 2) * this.dx, l * this.dy, (w - (this.rows - 1) / 2) * this.dz);
  }
  get count() { return this.items.length; }
  get type() { return this.items.length ? this.items[0].userData.kind : null; }
  add(m, dur = 0.28, h = 1.1, cb) {
    const i = this.items.length; this.items.push(m);
    if (dur <= 0) { cancelFly(m); this.g.add(m); m.position.copy(this.slot(i)); m.rotation.set(0, 0, 0); if (cb) cb(); }
    else fly(m, this.g, this.slot(i), dur, h, cb);
  }
  take() { const m = this.items.pop(); if (m) cancelFly(m); return m; }
  wpos() { return this.g.getWorldPosition(new V3()); }
}

/* ---------------- pop-in + particles ---------------- */
const pops = [];
function popIn(obj, delay = 0) { obj.scale.setScalar(0.001); pops.push({ obj, t: -delay }); }
function updatePops(dt) {
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.t += dt; if (p.t < 0) continue;
    const k = Math.min(1, p.t / 0.45);
    const s = k < 1 ? 1 + Math.sin(k * PI * 1.5) * (1 - k) * 0.6 - (1 - k) * (1 - k) * 0.9 : 1;
    p.obj.scale.setScalar(Math.max(0.001, s));
    if (k >= 1) { p.obj.scale.setScalar(1); pops.splice(i, 1); }
  }
}
const parts = [];
const partGeo = BOX(0.12, 0.12, 0.03);
function confetti(pos, n = 30) {
  const cols = [0xffc531, 0xff6b6b, 0x5ac8fa, 0x7ed957, 0xffffff, 0xb57edc];
  for (let i = 0; i < n; i++) {
    const m = mk(partGeo, new THREE.MeshBasicMaterial({ color: pick(cols), side: THREE.DoubleSide }), scene, pos.x, pos.y + 0.5, pos.z, false);
    parts.push({ m, v: new V3(rnd(-3, 3), rnd(4, 8), rnd(-3, 3)), t: 0, s: rnd(4, 10) });
  }
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.v.y -= 14 * dt;
    p.m.position.addScaledVector(p.v, dt); p.m.rotation.x += p.s * dt; p.m.rotation.y += p.s * dt;
    if (p.t > 1.4 || p.m.position.y < 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
}

/* ---------------- DOM labels ---------------- */
const labelsEl = $('labels');
const labels = new Set();
function addLabel(html, cls, getPos, oy = 0) {
  const el = document.createElement('div'); el.className = 'lbl ' + cls; el.innerHTML = html; labelsEl.appendChild(el);
  const L = { el, getPos, oy, show: true }; labels.add(L); return L;
}
function removeLabel(L) { if (!L) return; L.el.remove(); labels.delete(L); }
const _v = new V3();
function updateLabels() {
  for (const L of labels) {
    if (!L.show) { L.el.style.display = 'none'; continue; }
    _v.copy(L.getPos()); _v.project(camera);
    if (_v.z > 1) { L.el.style.display = 'none'; continue; }
    L.el.style.display = '';
    const x = (_v.x + 1) / 2 * innerWidth, y = (1 - _v.y) / 2 * innerHeight + L.oy;
    L.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translate(-50%,-100%)`;
  }
}
const floats = [];
function floatText(txt, pos) {
  const p = pos.clone(); const L = addLabel(txt, 'float', () => p);
  floats.push({ L, p, t: 0 });
}
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.t += dt; f.p.y += dt * 1.6; f.L.el.style.opacity = String(Math.min(1, 2.2 - f.t * 2));
    if (f.t > 1.1) { removeLabel(f.L); floats.splice(i, 1); }
  }
}

/* ---------------- humanoid (standard bone names = rig contract) ----------------
   Bones: Hips > Spine > Head, LeftArm > LeftForeArm, RightArm > RightForeArm,
          LeftUpLeg > LeftLeg, RightUpLeg > RightLeg.  Clips: idle · run · carry · attack.
   Later this procedural body is swapped for a GLB skinned to the same skeleton. */
function makeHumanoid(o) {
  const root = new THREE.Group();
  const B = {};
  const grp = (name, parent, x, y, z) => { const g = new THREE.Group(); g.name = name; g.position.set(x, y, z); parent.add(g); B[name] = g; return g; };
  const hips = grp('Hips', root, 0, 0.78, 0);
  const spine = grp('Spine', hips, 0, 0, 0);
  mk(CAP(0.25, 0.28), o.shirt, spine, 0, 0.32, 0);
  if (o.overall) { mk(CYL(0.262, 0.255, 0.3, 14), o.overall, spine, 0, 0.17, 0); mk(BOX(0.24, 0.2, 0.06), o.overall, spine, 0, 0.36, 0.22); }
  const head = grp('Head', spine, 0, 0.66, 0);

function animHuman(h, dt, moving, carrying, sp = 1, clip = null) {

    la = -s * 0.7; ra = s * 0.7; lf = -0.5; rf = -0.5; hy = 0.78 + Math.abs(c) * 0.05; sx = 0.12;
  } else {
    hy = 0.78 + Math.sin(h.t * 2.2) * 0.008; la = 0.05; ra = 0.05; lf = -0.1; rf = -0.1;
  }
  if (carrying) { la = ra = -1.3; lf = rf = -0.35; }
  if (clip === 'attack') { ra = -2.4 + Math.sin(h.t * 12) * 0.9; }
  if (clip === 'cheer') { la = ra = -2.8 + Math.sin(h.t * 16) * 0.2; }
  set(B.LeftUpLeg, 'x', lu); set(B.RightUpLeg, 'x', ru); set(B.LeftLeg, 'x', ll); set(B.RightLeg, 'x', rl);
  set(B.LeftArm, 'x', la); set(B.RightArm, 'x', ra); set(B.LeftForeArm, 'x', lf); set(B.RightForeArm, 'x', rf);
  set(B.Spine, 'x', sx);
  B.Hips.position.y += (hy - B.Hips.position.y) * k;
}

const bees = [];

function addBee(center, rad, field = false) {
  const g = new THREE.Group();
  const b = mk(beeBody, 0xffcf2e, g, 0, 0, 0, false); b.scale.set(1, 1, 1.4);
  mk(beeBody, 0x2a1a0e, g, 0, 0, -0.07, false).scale.set(0.8, 0.8, 0.5);
  const w1 = mk(beeWing, beeWingMat, g, 0.06, 0.07, 0, false), w2 = mk(beeWing, beeWingMat, g, -0.06, 0.07, 0, false);

}
function updateBees(t) {
  for (const b of bees) {
    const a = t * b.sp + b.ph;
    const x = b.c.x + Math.cos(a) * b.rad * (b.field ? 2.4 : 1) + Math.sin(a * 2.3) * 0.3;
    const z = b.c.z + Math.sin(a * 1.3) * b.rad * (b.field ? 0.6 : 1);
    const y = (b.field ? 0.8 : 1.4) + Math.sin(a * 3.1) * 0.35;
    const dx = x - b.g.position.x, dz = z - b.g.position.z;
    b.g.position.set(x, y, z); if (Math.abs(dx) + Math.abs(dz) > 1e-4) b.g.rotation.y = Math.atan2(dx, dz);
    const f = Math.sin(t * 60 + b.ph) * 0.6; b.w1.rotation.z = f; b.w2.rotation.z = -f;

  for (const o of obstacles) {
    if (o.c) {
      const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + r;
      if (d < m && d > 1e-5) { p.x = o.x + dx / d * m; p.z = o.z + dz / d * m; }
    } else {
      const cx = clamp(p.x, o.x0, o.x1), cz = clamp(p.z, o.z0, o.z1), dx = p.x - cx, dz = p.z - cz, d = Math.hypot(dx, dz);
      if (d < r) {
        if (d > 1e-5) { p.x = cx + dx / d * r; p.z = cz + dz / d * r; }
        else { const a = p.x - o.x0, b = o.x1 - p.x, c = p.z - o.z0, e = o.z1 - p.z, m = Math.min(a, b, c, e);
          if (m === a) p.x = o.x0 - r; else if (m === b) p.x = o.x1 + r; else if (m === c) p.z = o.z0 - r; else p.z = o.z1 + r; }
      }
    }
  }
  p.x = clamp(p.x, PA.minX, PA.maxX); p.z = clamp(p.z, PA.minZ, PA.maxZ);
}

/* ---------------- interactions ---------------- */
const near = (p, x, z, r) => (p.x - x) ** 2 + (p.z - z) ** 2 < r * r;
let actCd = 0, cashCd = 0, padCd = 0, moved = false;
function interact(dt) {
  const p = player.root.position, cap = PL.capacity;
  actCd -= dt; cashCd -= dt; padCd -= dt;
  // cash
  if (cashCd <= 0 && cashPile.count && near(p, CC.cash[0], CC.cash[1], 1.3)) {
    cashCd = 0.035; const b = cashPile.take();
    fly(b, player.root, new V3(0, 1.2, 0), 0.2, 0.5, () => { player.root.remove(b); money += b.userData.v; bumpMoney(); beep(1500 + Math.random() * 300, 0.03, 'square', 0.015); });
  }
  // unlock pads
  for (const pd of pads) {
    if (pd.done || !pd.g.visible || !near(p, pd.u.pos[0], pd.u.pos[1], 0.95)) continue;
    if (padCd <= 0 && money > 0) {
      padCd = 0.04;
      const amt = Math.min(money, Math.max(1, Math.ceil(pd.u.price / 20)), pd.u.price - pd.paid);
      money -= amt; pd.paid += amt; bumpMoney();
      const b = makeBill(); b.position.copy(p).setY(1.2); scene.add(b);
      fly(b, null, new V3(pd.u.pos[0], 0.1, pd.u.pos[1]), 0.25, 0.8, () => scene.remove(b));
      pd.fill.scale.x = Math.max(0.001, pd.paid / pd.u.price); renderPad(pd);
      beep(700 + pd.paid / pd.u.price * 600, 0.03, 'triangle', 0.02);
      if (pd.paid >= pd.u.price) {
        pd.done = true; pd.g.visible = false; pd.lbl.show = false; removeLabel(pd.lbl);
        doUnlock(pd.u.id); beep(660, 0.1); setTimeout(() => beep(990, 0.15), 90);
        revealPads(); checkEnd();
      }
    }
  }
  if (actCd > 0) return;
  const st = stack.type;
  // drop jars at machine input
  if (st === 'jar' && near(p, P.input[0], P.input[1], 1.5) && inputPile.count < 16) {
    inputPile.add(stack.take(), 0.22, 0.6); actCd = 0.08; beep(600, 0.03, 'triangle', 0.02); return;
  }
  // serve customer
  const f = frontReady();
  const sz = CC.serveZone;
  if (st === 'crate' && f && p.x > sz.minX && p.x < sz.maxX + 0.5 && p.z > sz.minZ && p.z < sz.maxZ && f.got < f.demand) {
    const c = stack.take(); f.pile.add(c, 0.3, 0.9); f.got++; renderBubble(f); actCd = 0.16; beep(760, 0.04, 'triangle', 0.03);
    if (f.got >= f.demand) { f.state = 'paying'; setTimeout(() => { pay(f); leave(f, true); }, 260); }
    return;
  }
  if (stack.count >= cap) return;
  // take crates
  if ((st === null || st === 'crate') && outputPile.count && near(p, P.output[0], P.output[1], 1.45)) {
    stack.add(outputPile.take(), 0.2, 0.6); actCd = 0.09; beep(480, 0.03, 'triangle', 0.02); return;
  }
  // take jars from hive trays
  if (st === null || st === 'jar') {
    for (const h of hives) {
      if (h.tray.count && near(p, h.trayPos.x, h.trayPos.z, 1.35)) { stack.add(h.tray.take(), 0.2, 0.6); actCd = 0.09; beep(560, 0.03, 'triangle', 0.02); return; }
    }
  }
}
let endShown = false;
function checkEnd() {
  if (endShown || pads.some(p => !p.done)) return;
  endShown = true;
  setTimeout(() => { $('endStats').textContent = `Đã bán ${sold} thùng mật · Doanh thu $${earned}`; $('end').style.display = 'flex'; }, 1300);
}
$('bKeep').onclick = () => { $('end').style.display = 'none'; };
$('bRestart').onclick = () => location.reload();

/* ---------------- guide arrow + hint ---------------- */
const arrow = new THREE.Group(); scene.add(arrow);
const am = new THREE.MeshBasicMaterial({ color: 0xffd23a });
mk(new THREE.ConeGeometry(0.32, 0.55, 4), am, arrow, 0, 0, 0, false).rotation.x = PI;
mk(BOX(0.18, 0.4, 0.18), am, arrow, 0, 0.42, 0, false);
const pointer = new THREE.Group(); scene.add(pointer);
const pt = mk(new THREE.ConeGeometry(0.22, 0.6, 3), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }), pointer, 0, 0.08, 1.15, false);
pt.rotation.x = PI / 2; pt.scale.z = 0.25;
function guide() {
  const st = stack.type, n = stack.count, cap = PL.capacity;
  const trayJars = hives.reduce((s, h) => s + h.tray.count, 0);
  const bestTray = () => hives.slice().sort((a, b) => b.tray.count - a.tray.count)[0];
  const serve = { p: new V3(CC.serve[0], 0, CC.serve[1]), t: 'Giao thùng mật cho khách ở quầy' };
  if (st === 'jar') {
    if (n >= cap || trayJars === 0) return { p: new V3(P.input[0], 0, P.input[1]), t: 'Mang hũ mật vào máy đóng gói' };
    const h = bestTray(); return { p: h.trayPos, t: 'Lấy thêm hũ mật' };
  }
  if (st === 'crate') {
    if (n >= cap || outputPile.count === 0) return customers.length ? serve : { p: serve.p, t: 'Chờ khách tới quầy' };
    return { p: new V3(P.output[0], 0, P.output[1]), t: 'Lấy thêm thùng mật' };
  }
  if (cashPile.count) return { p: new V3(CC.cash[0], 0, CC.cash[1]), t: 'Nhặt tiền ở quầy' };
  const pd = pads.find(p => !p.done && p.g.visible && money >= p.u.price - p.paid);
  if (pd) return { p: new V3(pd.u.pos[0], 0, pd.u.pos[1]), t: `Đứng lên ô để mở khóa: ${pd.u.name}` };
  if (outputPile.count) return { p: new V3(P.output[0], 0, P.output[1]), t: 'Lấy thùng mật ở đầu ra của máy' };
  if (trayJars) { const h = bestTray(); return { p: h.trayPos, t: 'Đến tổ ong lấy hũ mật' }; }
  if (machine.busy || machine.pending || inputPile.count || belt.items.length) return { p: new V3(P.output[0], 0, P.output[1]), t: 'Máy đang đóng gói…' };
  return { p: bestTray().trayPos, t: 'Chờ ong làm mật…' };
}
let hintText = '';
function updateGuide(t) {
  const g = guide(), p = player.root.position;
  if (g.t !== hintText) { hintText = g.t; $('hint').textContent = g.t; }
  const d = Math.hypot(g.p.x - p.x, g.p.z - p.z);
  arrow.visible = d > 1.2; pointer.visible = d > 2.2;
  arrow.position.set(g.p.x, 2.3 + Math.sin(t * 5) * 0.2, g.p.z); arrow.rotation.y = t * 2;
  pointer.position.set(p.x, 0.05, p.z); pointer.rotation.y = Math.atan2(g.p.x - p.x, g.p.z - p.z);
}

/* ---------------- HUD ---------------- */
let shownMoney = -1;
function bumpMoney() { const el = $('moneyPill'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function updateHUD() {
  if (shownMoney !== money) {
    shownMoney = money; $('money').textContent = money;
    for (const p of pads) if (p.g.visible && !p.done) renderPad(p);
  }
  const st = stack.type;
  $('stack').textContent = `${stack.count}/${PL.capacity}`;
  $('stackIcon').textContent = st === 'jar' ? '🍯' : st === 'crate' ? '📦' : '·';
}

/* ---------------- tools ---------------- */
let overview = false;
$('bLayout').onclick = e => { if (!overlay) buildOverlay(); else overlay.visible = !overlay.visible; e.currentTarget.classList.toggle('on', overlay.visible); };
$('bView').onclick = e => { overview = !overview; e.currentTarget.classList.toggle('on', overview); };
$('bMode').onclick = e => { custMode = custMode === 'queue' ? 'crowd' : 'queue'; e.currentTarget.textContent = custMode === 'queue' ? '👥 Hàng dài' : '👥 Đám đông'; customers.forEach(c => { if (c.state !== 'out') c.arrived = false; }); };
$('bCash').onclick = () => { money += 100; bumpMoney(); };
for (const b of document.querySelectorAll('#tools button')) b.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------------- camera ---------------- */
const camTgt = new V3(PL.start[0], 0, PL.start[1]);
const camPos = new V3();
function updateCamera(dt, snap) {
  const a = innerWidth / innerHeight, p = player.root.position;
  let want, look;
  if (overview) {
    const hf = Math.atan(Math.tan(20 * PI / 180) * a);
    const dist = Math.max(21 / Math.tan(hf), 13 / Math.tan(20 * PI / 180)) * 1.05;
    look = new V3(0, 0, 0.6); want = look.clone().add(new V3(0, 0.83, 0.56).normalize().multiplyScalar(dist));
  } else {
    // portrait: pull back and look more top-down so the stack and the next station stay on screen
    const port = a < 1;
    const dist = port ? clamp(6.5 / (Math.tan(20 * PI / 180) * a), 17, 46) : 17.1; // portrait: keep ~13 m of width on screen
    camTgt.lerp(new V3(clamp(p.x, -13, 11), 0, clamp(p.z, -6.5, 6.5) - (port ? 0.8 : 0)), snap ? 1 : Math.min(1, dt * 5));
    look = camTgt.clone(); want = look.clone().add((port ? new V3(0, 0.9, 0.44) : new V3(0, 13.5, 10.5)).normalize().multiplyScalar(dist));
  }
  camPos.lerp(want, snap ? 1 : Math.min(1, dt * 4)); camera.position.copy(camPos);
  camera.lookAt(camPos.clone().sub(want).add(look));
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------------- boot ---------------- */
for (let i = 0; i < R.startActive; i++) buildHive(i, false);
hives.forEach(h => { for (let k = 0; k < 3; k++) { const j = makeJar(); h.tray.add(j, 0); } });
spawnCustomer(true); spawnCustomer(true);
revealPads();
updateCamera(0, true);

let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  const mv = moveInput(), p = player.root.position;
  if (mv.l > 0.05) {
    if (!moved) { moved = true; $('tut').style.opacity = '0'; }
    p.x += mv.x * PL.speed * dt; p.z += mv.z * PL.speed * dt;
    heading = lerpAngle(heading, Math.atan2(mv.x, mv.z), Math.min(1, dt * 14));
  }
  collide(p); player.root.rotation.y = heading;
  animHuman(player, dt, mv.l > 0.05, stack.count > 0, 0.6 + mv.l * 0.5);
  updateHives(dt); updateBelt(dt); updateMachine(dt); updateCustomers(dt); interact(dt);
  updateFlyers(dt); updatePops(dt); updateParts(dt); updateFloats(dt); updateBees(T);
  windmill.rotation.z += dt * 0.9;
  updateGuide(T); updateCamera(dt); updateHUD();
  renderer.render(scene, camera); updateLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__hf = { get money() { return money; }, set money(v) { money = v; }, player, pads, customers, stack, setOverview: v => { overview = v; }, toggleLayout: () => $('bLayout').click() };
};

const fontReady = document.fonts && document.fonts.load ? document.fonts.load('800 40px "Baloo 2"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(start, start);
</script>
